<!DOCTYPE html>
<html>
<head>
<title>Bubble Sort Visualizer</title>
<style>
body{
    font-family:Arial;
    text-align:center;
}
.container{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    height:300px;
    margin-top:20px;
}
.bar{
    width:40px;
    margin:5px;
    background:steelblue;
    color:white;
}
</style>
</head>
<body>

<h2>Bubble Sort Visualization</h2>

<input type="text" id="arrayInput" value="5,3,8,1,6">
<button onclick="generate()">Generate</button>
<button onclick="bubbleSort()">Sort</button>

<div class="container" id="bars"></div>

<script>

let arr=[];

function generate(){
    arr=document.getElementById("arrayInput")
    .value.split(",")
    .map(Number);

    draw();
}

function draw(){
    let container=document.getElementById("bars");
    container.innerHTML="";

    arr.forEach(num=>{
        let bar=document.createElement("div");
        bar.className="bar";
        bar.style.height=(num*25)+"px";
        bar.innerHTML=num;
        container.appendChild(bar);
    });
}

async function bubbleSort(){

    for(let i=0;i<arr.length-1;i++){

        for(let j=0;j<arr.length-i-1;j++){

            if(arr[j]>arr[j+1]){

                [arr[j],arr[j+1]]=
                [arr[j+1],arr[j]];

                draw();

                await new Promise(r=>setTimeout(r,500));
            }
        }
    }
}

generate();

</script>
</body>
</html>
